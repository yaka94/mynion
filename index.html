<style>
/* ══════════════ MYNION — styles façon app mobile ══════════════ */
:root{
  --fond:#ffe135; --carte:#fff3a1; --carte2:#ffec70; --bord:#1a1a1a;
  --texte:#1b3a5c; --doux:#3e5a7a; --tresdoux:#5f7189;
  --jaune:#ffd93b; --jaune2:#ffb703; --vert:#2f9e44; --rouge:#d9363e; --bleu:#2e5c8a;
  --rayon:20px; --mono:"Fira Code",ui-monospace,"SF Mono",Consolas,Menlo,"Courier New",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{margin:0;background:var(--fond);color:var(--texte);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  font-size:16px;line-height:1.55;padding-bottom:86px;}
button{font:inherit;color:inherit;cursor:pointer;}
b{font-weight:700;}

/* ── barre du haut ── */
.barre{position:sticky;top:0;z-index:60;display:flex;justify-content:space-between;align-items:center;
  gap:8px;padding:10px 14px;background:rgba(14,17,24,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--bord);}
.logo{font-weight:800;font-size:18px;letter-spacing:.5px;white-space:nowrap;}
.logo b{color:var(--jaune);}
.outils{display:flex;align-items:center;gap:6px;}
.jeton{font-size:13px;color:var(--doux);background:var(--carte);border:1px solid var(--bord);
  border-radius:999px;padding:3px 10px;white-space:nowrap;}
.jeton b{color:var(--texte);}
.lang{background:var(--carte);border:1px solid var(--bord);border-radius:999px;padding:4px 9px;
  font-size:12px;font-weight:700;color:var(--doux);}
.lang.actif{background:var(--jaune);color:#1a1400;border-color:var(--jaune);}
.rond{background:var(--carte);border:1px solid var(--bord);border-radius:999px;padding:4px 8px;font-size:14px;}

/* ── structure ── */
#app{max-width:560px;margin:0 auto;padding:16px 14px 30px;}
.onglets{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;max-width:560px;
  margin:0 auto;background:rgba(23,28,38,.98);border-top:1px solid var(--bord);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:60;}
.onglets button{flex:1;background:none;border:none;color:var(--doux);font-size:11px;font-weight:600;
  display:flex;flex-direction:column;gap:2px;align-items:center;padding:6px 4px;border-radius:12px;}
.onglets button.actif{color:var(--jaune);background:rgba(255,217,59,.09);}
.onglets .ico{font-size:21px;line-height:1;}

/* ── cartes & boutons ── */
.carte{background:var(--carte);border:1px solid var(--bord);border-radius:var(--rayon);padding:16px;margin:0 0 14px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:14px;
  padding:13px 20px;font-weight:700;font-size:15px;transition:transform .08s,filter .15s;}
.btn:active{transform:scale(.97);}
.btn-primaire{background:linear-gradient(135deg,var(--jaune),var(--jaune2));color:#221a00;width:100%;}
.btn-vert{background:linear-gradient(135deg,#7dd956,#4cbb35);color:#062100;width:100%;}
.btn-fantome{background:var(--carte2);color:var(--texte);border:1px solid var(--bord);}
.btn-mini{padding:8px 14px;font-size:13px;border-radius:11px;}
.btn:disabled{opacity:.45;cursor:default;}
.ligne-boutons{display:flex;gap:8px;flex-wrap:wrap;}
.ligne-boutons .btn{flex:1;min-width:120px;}

/* ── accueil ── */
.hero{background:linear-gradient(160deg,#232a3d,#171c26);border:1px solid var(--bord);
  border-radius:20px;padding:18px;margin:0 0 16px;}
.hero .slogan{font-size:14px;color:var(--doux);margin:2px 0 12px;}
.hero .titre-xl{font-size:22px;font-weight:800;margin:0;}
.progression{display:flex;align-items:center;gap:12px;}
.barre-prog{flex:1;height:10px;background:#0b0e14;border-radius:999px;overflow:hidden;border:1px solid var(--bord);}
.barre-prog>div{height:100%;background:linear-gradient(90deg,var(--jaune),var(--jaune2));border-radius:999px;
  transition:width .4s;}
.pct{font-size:13px;font-weight:700;color:var(--jaune);min-width:38px;text-align:right;}
.niveau-etiquette{display:inline-block;background:rgba(255,217,59,.12);color:var(--jaune);
  border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700;margin-bottom:10px;}

.chemin{position:relative;margin-top:6px;}
.ch-item{display:flex;gap:12px;align-items:stretch;}
.ch-rail{display:flex;flex-direction:column;align-items:center;width:44px;flex-shrink:0;}
.ch-noeud{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:19px;font-weight:800;border:2px solid var(--bord);background:var(--carte);color:var(--doux);z-index:1;}
.ch-noeud.fait{background:linear-gradient(135deg,#2c5e22,#1d4017);border-color:#3f7a33;color:#b8f3a0;}
.ch-noeud.actuel{background:linear-gradient(135deg,var(--jaune),var(--jaune2));border-color:var(--jaune);
  color:#221a00;box-shadow:0 0 0 5px rgba(255,217,59,.18);animation:pulser 1.8s infinite;}
.ch-noeud.ferme{opacity:.55;}
@keyframes pulser{0%,100%{box-shadow:0 0 0 4px rgba(255,217,59,.15);}50%{box-shadow:0 0 0 9px rgba(255,217,59,.05);}}
.ch-tige{width:3px;flex:1;background:var(--bord);min-height:14px;border-radius:2px;}
.ch-tige.fait{background:#3f7a33;}
.ch-carte{flex:1;background:var(--carte);border:1px solid var(--bord);border-radius:14px;
  padding:10px 14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.ch-carte h3{margin:0 0 2px;font-size:15px;}
.ch-carte .sous{font-size:12.5px;color:var(--doux);}
.ch-carte .statut{font-size:18px;}
.ch-carte.cliquable{cursor:pointer;}
.ch-carte.cliquable:active{transform:scale(.985);}

/* ── leçon ── */
.barre-lecon{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.barre-lecon .barre-prog{flex:1;}
.quitter{background:var(--carte);border:1px solid var(--bord);border-radius:999px;width:34px;height:34px;
  font-size:15px;flex-shrink:0;}
.compteur-etapes{font-size:12px;color:var(--doux);font-weight:700;}
.titre-lecon{font-size:20px;font-weight:800;margin:0 0 12px;display:flex;gap:10px;align-items:center;}
.texte-etape{font-size:15.5px;}
.texte-etape .mot-code{font-family:var(--mono);background:#12233c;border:1px solid #1a1a1a;
  border-radius:7px;padding:1px 7px;font-size:13.5px;color:#ffd93b;white-space:nowrap;}

.bloc{background:#0b0e14;border:1px solid var(--bord);border-radius:13px;padding:13px 14px;color:#eaf2ff;
  font-family:var(--mono);font-size:13.5px;line-height:1.65;overflow-x:auto;margin:12px 0;white-space:pre;}
.bloc .k{color:var(--jaune);font-weight:700;}
.bloc .b{color:#ffb46e;}
.bloc .s{color:#9ce07d;}
.bloc .n{color:#7fd8ff;}
.bloc .c{color:#6b7490;font-style:italic;}
.bloc .o{color:#ff9fc4;}
.bloc-sortie{background:#0d1420;border:1px dashed #2c3a55;color:#a9c7e8;border-radius:13px;
  padding:11px 14px;font-family:var(--mono);font-size:13.5px;white-space:pre-wrap;margin:4px 0 12px;}
.etiquette-sortie{font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--tresdoux);
  font-weight:700;margin:12px 0 4px;}

/* quiz / options */
.options{display:flex;flex-direction:column;gap:9px;margin-top:14px;}
.option{background:var(--carte2);border:2px solid var(--bord);border-radius:13px;padding:13px 15px;
  text-align:left;font-size:15px;transition:border-color .12s,background .12s;white-space:pre-wrap;}
.option:hover{border-color:#3d4763;}
.option.bonne{border-color:var(--vert);background:rgba(125,217,86,.13);}
.option.mauvaise{border-color:var(--rouge);background:rgba(255,93,108,.12);}
.option:disabled{cursor:default;}
.tuiles{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px;}
.tuile{background:var(--carte2);border:2px solid var(--bord);border-radius:12px;padding:11px 16px;
  font-family:var(--mono);font-size:14.5px;}
.tuile.bonne{border-color:var(--vert);background:rgba(125,217,86,.13);}
.tuile.mauvaise{border-color:var(--rouge);background:rgba(255,93,108,.12);}
.trou{display:inline-block;min-width:70px;border:2px dashed var(--jaune);border-radius:8px;
  padding:0 10px;color:var(--jaune);font-weight:700;text-align:center;}
.code-a-trou{margin:0;}

/* exercice d'ordre */
.pioche,.empilement{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.ligne-ordre{background:var(--carte2);border:2px solid var(--bord);border-radius:11px;padding:10px 13px;
  font-family:var(--mono);font-size:13px;white-space:pre;text-align:left;}
.ligne-ordre.choisie{border-color:var(--jaune);background:rgba(255,217,59,.1);}
.empilement:empty::after{content:attr(data-vide);display:block;border:2px dashed var(--bord);
  border-radius:11px;padding:10px 13px;color:var(--tresdoux);font-size:13px;text-align:center;}
.num-ligne{color:var(--tresdoux);margin-right:8px;font-weight:700;}

/* rétroaction */
.retro{border-radius:14px;padding:13px 15px;margin:14px 0 0;font-size:14.5px;animation:pop .25s;}
.retro.bonne{background:rgba(125,217,86,.13);border:1px solid var(--vert);}
.retro.mauvaise{background:rgba(255,93,108,.12);border:1px solid var(--rouge);animation:secousse .35s;}
.retro .titre-retro{font-weight:800;margin-bottom:3px;}
.retro.bonne .titre-retro{color:var(--vert);}
.retro.mauvaise .titre-retro{color:var(--rouge);}
@keyframes pop{from{transform:scale(.96);opacity:.4;}to{transform:scale(1);opacity:1;}}
@keyframes secousse{0%,100%{transform:translateX(0);}20%{transform:translateX(-6px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}

/* éditeur */
.editeur-wrap{display:flex;background:#0b0e14;border:1px solid var(--bord);border-radius:13px;
  overflow:hidden;margin:10px 0;}
.numeros{padding:12px 0 12px 12px;text-align:right;color:var(--tresdoux);font-family:var(--mono);
  font-size:13.5px;line-height:1.65;user-select:none;overflow:hidden;min-width:34px;white-space:pre;}
.zone-editeur{position:relative;flex:1;}
.zone-editeur pre,.zone-editeur textarea{position:absolute;inset:0;margin:0;padding:12px 12px 12px 8px;
  font-family:var(--mono);font-size:13.5px;line-height:1.65;white-space:pre;overflow:auto;
  border:none;outline:none;background:transparent;tab-size:4;}
.zone-editeur pre{pointer-events:none;color:var(--texte);}
.zone-editeur textarea{color:transparent;caret-color:var(--jaune);resize:none;z-index:2;}

.console{background:#05070c;border:1px solid var(--bord);border-radius:13px;padding:12px 14px;color:#e8f1ff;
  font-family:var(--mono);font-size:13.5px;white-space:pre-wrap;word-break:break-word;min-height:52px;
  max-height:280px;overflow-y:auto;margin:10px 0 0;}
.console.vide{color:var(--tresdoux);font-style:italic;}
.console .err{color:var(--rouge);}

details.python-secret{margin-top:12px;background:var(--carte);border:1px solid var(--bord);border-radius:13px;}
details.python-secret summary{cursor:pointer;padding:11px 14px;font-size:13.5px;font-weight:700;color:var(--bleu);}
details.python-secret .bloc{margin:0 12px 12px;}

details.entree-bloc{margin-top:10px;background:var(--carte);border:1px solid var(--bord);border-radius:13px;}
details.entree-bloc summary{cursor:pointer;padding:10px 14px;font-size:13.5px;font-weight:700;color:var(--doux);}
.entree-zone{padding:0 12px 12px;}
textarea.champ{width:100%;min-height:70px;background:#0b0e14;border:1px solid var(--bord);border-radius:11px;
  color:var(--texte);font-family:var(--mono);font-size:14px;padding:10px;resize:vertical;}
.aide-entree{font-size:12px;color:var(--tresdoux);margin:6px 2px 8px;}

/* labo */
.select-exemples{width:100%;background:var(--carte2);color:var(--texte);border:1px solid var(--bord);
  border-radius:12px;padding:11px 12px;font-size:14px;margin-bottom:4px;}
.mini-note{font-size:12.5px;color:var(--tresdoux);margin:8px 2px;}

/* dictionnaire */
.recherche{width:100%;background:var(--carte2);border:1px solid var(--bord);border-radius:12px;
  color:var(--texte);font-size:15px;padding:11px 14px;margin-bottom:12px;}
.table-dico{width:100%;border-collapse:collapse;font-size:13.5px;}
.table-dico th{text-align:left;color:var(--tresdoux);font-size:11px;letter-spacing:.6px;
  text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--bord);}
.table-dico td{padding:9px 8px;border-bottom:1px solid #202738;vertical-align:top;}
.table-dico code{font-family:var(--mono);background:#0b0e14;border:1px solid var(--bord);border-radius:6px;
  padding:1px 6px;font-size:12.5px;white-space:nowrap;}
.table-dico .mm{color:var(--jaune);font-weight:700;}
.table-dico .pp{color:#7fd8ff;}
.table-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px;}

/* célébration */
.ecran-fete{text-align:center;padding:34px 10px 20px;}
.ecran-fete .gros{font-size:64px;animation:rebond .7s;}
.ecran-fete h2{margin:12px 0 6px;font-size:22px;}
.ecran-fete .xp-gagnee{color:var(--jaune);font-weight:800;font-size:17px;margin-bottom:16px;}
@keyframes rebond{0%{transform:scale(.3);}55%{transform:scale(1.25);}100%{transform:scale(1);}}
.confetti{position:fixed;top:-40px;font-size:24px;z-index:99;pointer-events:none;animation:tomber 2.2s ease-in forwards;}
@keyframes tomber{to{transform:translateY(115vh) rotate(720deg);opacity:.7;}}

/* diplôme & partage */
.diplome{text-align:center;padding:26px 18px;}
.diplome .gros{font-size:60px;animation:rebond .7s;}
.diplome h2{margin:10px 0 8px;font-size:21px;}
.champ-nom{width:100%;max-width:340px;background:var(--carte2);border:2px dashed var(--bord);border-radius:12px;
  color:var(--texte);font-size:16px;padding:11px 14px;margin:6px auto 10px;display:block;text-align:center;}
.champ-nom:focus{outline:none;border-color:var(--jaune);}
.diplome-etiquette{font-size:20px;font-weight:800;color:var(--jaune);min-height:28px;font-style:italic;}
.etiquette-partage{font-size:12.5px;color:var(--doux);font-weight:700;margin:16px 0 8px;letter-spacing:.4px;}
.partage{display:grid;grid-template-columns:1fr 1fr;gap:9px;max-width:420px;margin:0 auto;}
.btn-partage{display:flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:12px;
  padding:12px 10px;font-size:13.5px;font-weight:700;color:#fff;transition:transform .08s,filter .15s;}
.btn-partage b{font-family:Georgia,serif;font-size:15px;}
.btn-partage.pli{background:#0a66c2;}
.btn-partage.pfb{background:#1877f2;}
.btn-partage.pxx{background:#14171a;}
.btn-partage.pcp{background:var(--carte2);border:1px solid var(--bord);color:var(--texte);}
.btn-partage:active{transform:scale(.97);}

/* toast & divers */
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#252c3d;color:var(--texte);
  border:1px solid var(--bord);border-radius:999px;padding:10px 18px;font-size:13.5px;z-index:99;
  animation:pop .25s;box-shadow:0 8px 30px rgba(0,0,0,.45);max-width:86vw;text-align:center;}
.pied{color:var(--tresdoux);font-size:12px;text-align:center;margin-top:22px;line-height:1.8;}
.pied a{color:var(--doux);}
a.lien{color:var(--bleu);}
hr.sep{border:none;border-top:1px solid var(--bord);margin:16px 0;}
.champ-info{font-size:13px;color:var(--doux);background:var(--carte2);border-radius:11px;padding:9px 12px;margin:10px 0;}
.gagne{color:var(--jaune);font-weight:800;}

@media (min-width:640px){
  body{padding-bottom:96px;}
  .hero{padding:24px;}
  .hero .titre-xl{font-size:26px;}
}

/* ═══════════════ 🍌 BANANA POP — le design MYNION ═══════════════
   Tout jaune, salopette denim, contours cartoon noirs, boutons pilules. */
body{font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
h1,h2,h3,.logo,.btn{font-family:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;}

/* barre du haut = salopette denim */
.barre{background:#2e5c8a;border-bottom:3px solid #1a1a1a;}
.logo{color:#fff;}
.logo b{color:#ffe135;}
.jeton{background:#1b3a5c;border:2px solid #1a1a1a;color:#cfe3ff;}
.jeton b{color:#ffe135;}
.lang,.rond{background:#1b3a5c;border:2px solid #1a1a1a;color:#ffe135;}
.lang.actif{background:#ffe135;color:#1a1a1a;border-color:#1a1a1a;}

/* menu du bas */
.onglets{background:#2e5c8a;border-top:3px solid #1a1a1a;}
.onglets button{color:#cfe3ff;}
.onglets button.actif{color:#ffe135;background:rgba(255,225,53,.16);}
.onglets button.verrouille{opacity:.5;}

/* cartes façon stickers */
.carte{border:3px solid #1a1a1a;box-shadow:5px 5px 0 #1a1a1a;border-radius:22px;}
.hero{background:#ffe135;border:3px solid #1a1a1a;box-shadow:6px 6px 0 #1a1a1a;border-radius:22px;}
.pct,.niveau-etiquette,.gagne,.xp-gagnee,.diplome-etiquette{color:#1b3a5c;}
.niveau-etiquette{background:rgba(27,58,92,.12);border:2px solid #1a1a1a;}

/* progression : la banane avance avec toi 🍌 */
.barre-prog{background:#fff;border:2px solid #1a1a1a;height:12px;overflow:visible;}
.barre-prog>div{position:relative;}
.barre-prog>div::after{content:"🍌";position:absolute;right:-9px;top:50%;
  transform:translateY(-50%);font-size:15px;line-height:1;filter:drop-shadow(1px 1px 0 #1a1a1a);}

/* boutons pilules cartoon */
.btn{border-radius:50px;border:3px solid #1a1a1a;box-shadow:4px 4px 0 #1a1a1a;
  transition:transform .12s,box-shadow .12s;}
.btn-primaire{color:#1a1a1a;}
.btn:not(:disabled):hover{transform:translate(-2px,-2px) scale(1.02);box-shadow:6px 6px 0 #1a1a1a;}
.btn:not(:disabled):active{transform:translate(2px,2px);box-shadow:1px 1px 0 #1a1a1a;}

/* nœuds du parcours = lentilles de lunettes 🥽 */
.ch-noeud{background:#d7dde3;border:3px solid #1a1a1a;color:#1b3a5c;box-shadow:3px 3px 0 rgba(26,26,26,.3);}
.ch-tige{background:#1a1a1a;width:4px;}

/* cartes leçon = mini-Minions (salopette en bas) */
.ch-carte{border:3px solid #1a1a1a;box-shadow:5px 5px 0 #1a1a1a;border-radius:20px;
  padding-bottom:30px;position:relative;overflow:hidden;}
.ch-carte::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22px;
  background:#2e5c8a;border-top:3px solid #1a1a1a;}
.ch-carte>div{position:relative;z-index:1;}

/* zones de code : nuit denim (lisibilité) */
.bloc,.console,.editeur-wrap,.bloc-sortie{background:#12233c;border-color:#1a1a1a;}

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   🍌 NOYAU MYNION (JavaScript) — lexer, analyseur, interpréteur,
   transpileur (→ Python) et coloration syntaxique.
   S'exécute à 100 % dans le navigateur : aucun serveur nécessaire.
   ═══════════════════════════════════════════════════════════════════════════ */
"use strict";

/* ── Dictionnaires partagés ─────────────────────────────────────────────── */
const MOTS_STRUCTURE = {
  pwede: "if", simikaru: "elif", nononio: "else",
  paratu: "for", dan: "in", beedo: "while",
  stupa: "break", bananos: "continue",
  minion: "def", gelato: "return", recrute: "import",
  tiamo: "and", oula: "or", nabanana: "not",
  tulaliloo: "True", bananonina: "False",
  bello: "print", poka: "input", bananera: "range",
  muchos: "len", hanadulsae: "int", blabla: "str",
  mewant: "=",
};
const MOTS_NOMBRES = {
  gong: 0, hana: 1, dul: 2, sae: 3, net: 4, daseot: 5,
  yeoseot: 6, ilgop: 7, yeodeol: 8, ahop: 9, yeol: 10,
};
const MOTS_COMMENTAIRE = ["banana", "bananana", "poopaye"];
const MOTS_INBUILT = ["pousse", "surprise"];

/* ═══════════════════ 1. LEXER ═══════════════════ */
function estLettreNom(c) {
  return /[A-Za-z_\u00C0-\u024F]/.test(c);
}
function estCharNom(c) {
  return /[A-Za-z0-9_\u00C0-\u024F]/.test(c);
}
function motA(s, k) {
  let j = k;
  while (j < s.length && estCharNom(s[j])) j++;
  return s.slice(k, j).toLowerCase();
}

class ErreurMynion extends Error {
  constructor(message, ligne) {
    super(message);
    this.ligne = ligne;
    this.mynion = true;
  }
}

function lexique(src) {
  const T = [];
  let i = 0, ligne = 1;
  const n = src.length;
  const pile = [0];
  let debutLigne = true;
  let prof = 0; // profondeur ( [ — pas d'indentation dans les continuations

  function aj(type, val) { T.push({ type, val, ligne }); }
  function traiterIndente(indent) {
    const haut = pile[pile.length - 1];
    if (indent > haut) { pile.push(indent); aj("INDENT"); }
    else if (indent < haut) {
      while (pile[pile.length - 1] > indent) { pile.pop(); aj("DEDENT"); }
      if (pile[pile.length - 1] !== indent) throw new ErreurMynion("Les bananes sont mal alignées ! Chaque bloc doit être indenté de 4 espaces, toujours pareil.", ligne);
    }
  }

  while (i < n) {
    const c = src[i];

    /* fin de ligne */
    if (c === "\n") {
      if (prof === 0 && T.length && T[T.length - 1].type !== "NL" && T[T.length - 1].type !== "INDENT" && T[T.length - 1].type !== "DEDENT") aj("NL");
      ligne++; i++; debutLigne = true;
      continue;
    }

    /* indentation en début de ligne (même si la ligne ne commence pas par une espace !) */
    if (debutLigne) {
      if (c === " " || c === "\t") {
        let indent = 0;
        while (i < n && (src[i] === " " || src[i] === "\t")) { indent += (src[i] === "\t") ? 4 : 1; i++; }
        const resteVide = (i >= n || src[i] === "\n" || src[i] === "#" || MOTS_COMMENTAIRE.includes(motA(src, i)));
        if (!resteVide && prof === 0) traiterIndente(indent);
        debutLigne = false;
        continue;
      }
      if (c !== "#") {
        /* la ligne commence directement par du code → indentation 0 */
        if (prof === 0 && !MOTS_COMMENTAIRE.includes(motA(src, i))) traiterIndente(0);
        debutLigne = false;
      }
    }

    if (c === " " || c === "\t") { i++; continue; }
    debutLigne = false;

    /* commentaire # du Python (accepté) */
    if (c === "#") { while (i < n && src[i] !== "\n") i++; continue; }

    /* chaîne de caractères */
    if (c === '"' || c === "'") {
      let j = i + 1, s = "";
      while (j < n && src[j] !== c && src[j] !== "\n") {
        if (src[j] === "\\") {
          const d = src[j + 1];
          if (d === "n") s += "\n";
          else if (d === "t") s += "\t";
          else if (d === "\\") s += "\\";
          else if (d === '"') s += '"';
          else if (d === "'") s += "'";
          else s += d === undefined ? "" : d;
          j += 2;
        } else { s += src[j]; j++; }
      }
      if (j >= n || src[j] === "\n") throw new ErreurMynion("Guillemet non fermé — il manque un \" quelque part sur cette ligne.", ligne);
      aj("CHAINE", s);
      i = j + 1;
      continue;
    }

    /* nom / mot-clé */
    if (estLettreNom(c)) {
      let j = i;
      while (j < n && estCharNom(src[j])) j++;
      const bas = src.slice(i, j).toLowerCase();

      /* « me want » → affectation */
      if (bas === "me") {
        let k = j;
        while (k < n && (src[k] === " " || src[k] === "\t")) k++;
        if (src.slice(k, k + 4).toLowerCase() === "want" && (k + 4 >= n || !estCharNom(src[k + 4]))) {
          aj("AFFECT", "=");
          i = k + 4;
          continue;
        }
      }
      if (bas === "mewant") { aj("AFFECT", "="); i = j; continue; }

      /* commentaire banana */
      if (MOTS_COMMENTAIRE.includes(bas)) { while (i < n && src[i] !== "\n") i++; continue; }

      /* f-string → pas (encore) supporté */
      if ((bas === "f" || bas === "rf" || bas === "fr") && (src[j] === '"' || src[j] === "'")) {
        throw new ErreurMynion("Le Labo ne gère pas encore les f-strings — colle avec + et convertis avec blabla().", ligne);
      }

      /* nombre minion */
      if (bas in MOTS_NOMBRES) { aj("NOMBRE", MOTS_NOMBRES[bas]); i = j; continue; }

      aj("NOM", src.slice(i, j));
      i = j;
      continue;
    }

    /* nombre */
    if (c >= "0" && c <= "9") {
      let j = i;
      while (j < n && ((src[j] >= "0" && src[j] <= "9") || src[j] === ".")) j++;
      aj("NOMBRE", parseFloat(src.slice(i, j)));
      i = j;
      continue;
    }

    /* opérateurs */
    const deux = src.substr(i, 2);
    if (deux === "**" || deux === "//" || deux === "==" || deux === "!=" || deux === "<=" || deux === ">=") {
      aj("OP", deux); i += 2; continue;
    }
    if ("+-*/%<>=()[]{},:.".includes(c)) {
      if (c === "(" || c === "[") prof++;
      if (c === ")" || c === "]") prof = Math.max(0, prof - 1);
      aj("OP", c); i++;
      continue;
    }
    if (c === "!") throw new ErreurMynion("Le « ! » tout seul n'existe pas : la différence, c'est « != ».", ligne);
    if (c === ";") throw new ErreurMynion("Un Mynion n'écrit qu'une instruction par ligne — pas de « ; ».", ligne);
    throw new ErreurMynion("Caractère inconnu : « " + c + " »", ligne);
  }
  if (T.length && T[T.length - 1].type !== "NL") aj("NL");
  while (pile.length > 1) { pile.pop(); aj("DEDENT"); }
  aj("FIN");
  return T;
}

/* ═══════════════════ 2. ANALYSEUR (parser) ═══════════════════ */
function analyser(T) {
  let p = 0;
  const voir = () => T[p];
  function estOP(v) { const t = T[p]; return t.type === "OP" && t.val === v; }
  function estMot(v) { const t = T[p]; return t.type === "NOM" && t.val.toLowerCase() === v; }
  function estAffect() { const t = T[p]; return t.type === "AFFECT" || (t.type === "OP" && t.val === "="); }
  function av() { return T[p++]; }
  function attendreOP(v) {
    if (!estOP(v)) throw new ErreurMynion("Il manque « " + v + " » ici (regard : " + (T[p].val ?? "") + ").", T[p].ligne);
    av();
  }
  function attendreMot(v, autre) {
    if (!estMot(v) && !(autre && estMot(autre))) {
      throw new ErreurMynion("Je m'attendais à « " + v + " » ici.", T[p].ligne);
    }
    av();
  }

  function programme() {
    const instrs = [];
    while (voir().type !== "FIN") {
      if (voir().type === "NL") { av(); continue; }
      instrs.push(instruction());
    }
    return { t: "bloc", instrs };
  }

  function bloc() {
    if (voir().type === "NL") {
      av();
      if (voir().type !== "INDENT") throw new ErreurMynion("Bloc vide — indente la ligne suivante de 4 espaces (l'échelle à bananes !).", voir().ligne);
      av();
      const instrs = [];
      while (voir().type !== "DEDENT" && voir().type !== "FIN") {
        if (voir().type === "NL") { av(); continue; }
        instrs.push(instruction());
      }
      if (voir().type === "DEDENT") av();
      return { t: "bloc", instrs };
    }
    return { t: "bloc", instrs: [instruction()] };
  }

  function instruction() {
    const t = voir();
    if (t.type === "NOM") {
      const bas = t.val.toLowerCase();
      if (bas === "pwede") return instructionSi();
      if (bas === "paratu") return instructionPour();
      if (bas === "beedo") return instructionTantque();
      if (bas === "minion") return instructionMinion();
      if (bas === "gelato") {
        av();
        const fin = voir().type === "NL" || voir().type === "FIN" || voir().type === "DEDENT";
        return { t: "gelato", valeur: fin ? null : expression(), ligne: t.ligne };
      }
      if (bas === "stupa") { av(); return { t: "stupa", ligne: t.ligne }; }
      if (bas === "bananos") { av(); return { t: "bananos", ligne: t.ligne }; }
      if (bas === "recrute") throw new ErreurMynion("Le Labo n'a pas besoin de recruter de module — surprise() est déjà dans le repaire !", t.ligne);
    }
    /* affectation ou expression */
    if (t.type === "NOM") {
      const sauve = p;
      const nom = av().val;
      if (estAffect()) { av(); return { t: "affect", nom, valeur: expression(), ligne: t.ligne }; }
      if (estOP("[")) {
        av();
        const idx = expression();
        attendreOP("]");
        if (estAffect()) { av(); return { t: "affectIndex", nom, idx, valeur: expression(), ligne: t.ligne }; }
        p = sauve;
      } else {
        p = sauve;
      }
    }
    if (estAffect()) throw new ErreurMynion("Une affectation commence par le nom de la boîte : nom me want valeur.", t.ligne);
    return { t: "expr", valeur: expression(), ligne: t.ligne };
  }

  function instructionSi() {
    const ligne = voir().ligne;
    attendreMot("pwede");
    const branches = [];
    const cond = expression();
    attendreOP(":");
    branches.push({ cond, bloc: bloc() });
    let sinon = null;
    while (true) {
      if (estMot("simikaru")) {
        av();
        const c2 = expression();
        attendreOP(":");
        branches.push({ cond: c2, bloc: bloc() });
        continue;
      }
      if (estMot("nononio")) {
        av();
        attendreOP(":");
        sinon = bloc();
        break;
      }
      break;
    }
    return { t: "si", branches, sinon, ligne };
  }

  function instructionPour() {
    const ligne = voir().ligne;
    attendreMot("paratu");
    if (voir().type !== "NOM") throw new ErreurMynion("Il faut un nom de variable après paratu.", voir().ligne);
    const nom = av().val;
    attendreMot("dan", "in");
    const it = expression();
    attendreOP(":");
    return { t: "pour", nom, it, corps: bloc(), ligne };
  }

  function instructionTantque() {
    const ligne = voir().ligne;
    attendreMot("beedo");
    const cond = expression();
    attendreOP(":");
    return { t: "tantque", cond, corps: bloc(), ligne };
  }

  function instructionMinion() {
    const ligne = voir().ligne;
    attendreMot("minion");
    if (voir().type !== "NOM") throw new ErreurMynion("Il faut un nom de minion après minion (ex : minion saluer(nom) :).", voir().ligne);
    const nom = av().val;
    attendreOP("(");
    const params = [];
    if (!estOP(")")) {
      if (voir().type !== "NOM") throw new ErreurMynion("Nom de paramètre invalide.", voir().ligne);
      params.push(av().val);
      while (estOP(",")) { av(); if (voir().type !== "NOM") throw new ErreurMynion("Nom de paramètre invalide.", voir().ligne); params.push(av().val); }
    }
    attendreOP(")");
    attendreOP(":");
    return { t: "minion", nom, params, corps: bloc(), ligne };
  }

  /* ── expressions (précédence croissante) ── */
  function expression() { return exprOu(); }
  function exprOu() {
    let g = exprEt();
    while (estMot("oula")) { av(); const d = exprEt(); g = { t: "bin", op: "oula", g, d }; }
    return g;
  }
  function exprEt() {
    let g = exprNon();
    while (estMot("tiamo")) { av(); const d = exprNon(); g = { t: "bin", op: "tiamo", g, d }; }
    return g;
  }
  function exprNon() {
    if (estMot("nabanana")) { av(); return { t: "non", e: exprNon() }; }
    return comparaison();
  }
  function comparaison() {
    let g = arith();
    const OPS = ["==", "!=", "<", "<=", ">", ">="];
    while (voir().type === "OP" && OPS.includes(voir().val)) {
      const op = av().val;
      g = { t: "bin", op, g, d: arith() };
    }
    return g;
  }
  function arith() {
    let g = terme();
    while (estOP("+") || estOP("-")) { const op = av().val; g = { t: "bin", op, g, d: terme() }; }
    return g;
  }
  function terme() {
    let g = unaire();
    while (estOP("*") || estOP("/") || estOP("//") || estOP("%")) { const op = av().val; g = { t: "bin", op, g, d: unaire() }; }
    return g;
  }
  function unaire() {
    if (estOP("-")) { av(); return { t: "neg", e: unaire() }; }
    if (estOP("+")) { av(); return unaire(); }
    return puissance();
  }
  function puissance() {
    const b = postfixe();
    if (estOP("**")) { av(); return { t: "bin", op: "**", g: b, d: unaire() }; }
    return b;
  }
  function postfixe() {
    let e = atome();
    while (true) {
      if (estOP("[")) { av(); const idx = expression(); attendreOP("]"); e = { t: "index", e, idx }; continue; }
      if (estOP(".")) {
        av();
        if (voir().type !== "NOM") throw new ErreurMynion("Il faut un nom de méthode après le point.", voir().ligne);
        const m = av().val;
        let args = [];
        if (estOP("(")) { av(); args = listeArgs(); }
        e = { t: "methode", e, nom: m, args };
        continue;
      }
      break;
    }
    return e;
  }
  function listeArgs() {
    const args = [];
    if (!estOP(")")) {
      args.push(expression());
      while (estOP(",")) { av(); args.push(expression()); }
    }
    attendreOP(")");
    return args;
  }
  function atome() {
    const t = voir();
    if (t.type === "NOMBRE" || t.type === "CHAINE") { av(); return { t: "const", val: t.val }; }
    if (t.type === "NOM") {
      const bas = t.val.toLowerCase();
      if (bas === "tulaliloo") { av(); return { t: "const", val: true }; }
      if (bas === "bananonina") { av(); return { t: "const", val: false }; }
      if (MOTS_STRUCTURE[bas] && bas !== "bello" && bas !== "poka" && bas !== "bananera" && bas !== "muchos" && bas !== "hanadulsae" && bas !== "blabla" && bas !== "mewant") {
        throw new ErreurMynion("« " + t.val + " » est un mot-clé, il ne peut pas être utilisé comme valeur ici.", t.ligne);
      }
      av();
      if (estOP("(")) { av(); return { t: "appel", nom: t.val, args: listeArgs(), ligne: t.ligne }; }
      return { t: "var", nom: t.val };
    }
    if (estOP("(")) { av(); const e = expression(); attendreOP(")"); return e; }
    if (estOP("[")) {
      av();
      const items = [];
      if (!estOP("]")) {
        items.push(expression());
        while (estOP(",")) { av(); items.push(expression()); }
      }
      attendreOP("]");
      return { t: "liste", items };
    }
    if (t.type === "NL" || t.type === "FIN" || t.type === "DEDENT") {
      throw new ErreurMynion("Expression incomplète — il manque quelque chose à la fin de la ligne.", t.ligne);
    }
    throw new ErreurMynion("Je ne comprends pas « " + t.val + " » dans cette expression.", t.ligne);
  }

  const ast = programme();
  if (voir().type !== "FIN") throw new ErreurMynion("Il y a quelque chose en trop à la fin du programme ici.", voir().ligne);
  return ast;
}

/* ═══════════════════ 3. INTERPRÉTEUR ═══════════════════ */
function creerEnv(parent) { return { vars: new Map(), parent }; }
function chercherEnv(env, nom) {
  let e = env;
  while (e) { if (e.vars.has(nom)) return e; e = e.parent; }
  return null;
}
function verite(v) {
  if (typeof v === "boolean") return v;
  if (typeof v === "number") return v !== 0;
  if (typeof v === "string") return v.length > 0;
  if (Array.isArray(v)) return v.length > 0;
  return false;
}
function egal(a, b) {
  if (Array.isArray(a) && Array.isArray(b)) {
    if (a.length !== b.length) return false;
    for (let k = 0; k < a.length; k++) { if (!egal(a[k], b[k])) return false; }
    return true;
  }
  if (typeof a === "boolean" || typeof b === "boolean") {
    return a === b;
  }
  return a === b;
}
function repr(v) {
  if (typeof v === "string") {
    const q = (v.includes("'") && !v.includes('"')) ? '"' : "'";
    return q + v + q;
  }
  return versTexte(v);
}
function versTexte(v) {
  if (typeof v === "boolean") return v ? "True" : "False";
  if (typeof v === "number") return String(v);
  if (typeof v === "string") return v;
  if (Array.isArray(v)) return "[" + v.map(repr).join(", ") + "]";
  if (v === null || v === undefined) return "None";
  return String(v);
}
function nombreEntier(v, ligne, qui) {
  if (typeof v === "number" && Number.isInteger(v)) return v;
  if (typeof v === "number") return Math.trunc(v);
  throw new ErreurMynion(qui + " attend un nombre entier.", ligne);
}

const Mynion = (function () {

  function executer(src, options) {
    options = options || {};
    const entreeBrute = options.entree || "";
    const file = entreeBrute === "" ? [] : entreeBrute.replace(/\n+$/, "").split("\n");
    const ctx = { sortie: "", file, pas: 0, MAX_PAS: 250000 };
    const globalEnv = creerEnv(null);

    let ast;
    try {
      ast = analyser(lexique(src));
    } catch (e) {
      return { sortie: ctx.sortie, erreur: { message: e.message, ligne: e.ligne } };
    }
    try {
      execBloc(ast, globalEnv, ctx);
      return { sortie: ctx.sortie };
    } catch (e) {
      if (e && e.signal === "gelato") {
        return { sortie: ctx.sortie, erreur: { message: "Un gelato en dehors d'un minion ? Chaque glace a sa place !", ligne: e.ligne } };
      }
      if (e && e.signal === "stupa") {
        return { sortie: ctx.sortie, erreur: { message: "Stupa (stop) en dehors d'une boucle beedo/paratu !", ligne: e.ligne } };
      }
      if (e && e.signal === "bananos") {
        return { sortie: ctx.sortie, erreur: { message: "Bananos (continue) en dehors d'une boucle !", ligne: e.ligne } };
      }
      return { sortie: ctx.sortie, erreur: { message: e.mynion ? e.message : "Erreur interne du Labo : " + e.message, ligne: e.ligne } };
    }
  }

  function budget(ctx, ligne) {
    if (++ctx.pas > ctx.MAX_PAS) {
      throw new ErreurMynion("Le programme travaille trop longtemps… boucle beedo infinie ? Vérifie qu'elle s'arrête un jour (stupa !).", ligne);
    }
  }

  function execBloc(bloc, env, ctx) {
    for (const instr of bloc.instrs) execInstr(instr, env, ctx);
  }

  function execInstr(instr, env, ctx) {
    budget(ctx, instr.ligne);
    switch (instr.t) {
      case "affect":
        env.vars.set(instr.nom, evalExpr(instr.valeur, env, ctx));
        return;
      case "affectIndex": {
        const cible = evalExpr({ t: "var", nom: instr.nom }, env, ctx);
        const idx = evalExpr(instr.idx, env, ctx);
        const val = evalExpr(instr.valeur, env, ctx);
        if (!Array.isArray(cible)) throw new ErreurMynion("Seuls les régimes (listes) acceptent un remplacement par indice.", instr.ligne);
        const i2 = nombreEntier(idx, instr.ligne, "L'indice");
        if (i2 < 0 || i2 >= cible.length) throw new ErreurMynion("Tu cherches une banane absente du régime ! (indice " + i2 + " sur une liste de " + cible.length + ")", instr.ligne);
        cible[i2] = val;
        return;
      }
      case "si": {
        for (const br of instr.branches) {
          if (verite(evalExpr(br.cond, env, ctx))) { execBloc(br.bloc, env, ctx); return; }
        }
        if (instr.sinon) execBloc(instr.sinon, env, ctx);
        return;
      }
      case "pour": {
        const it = evalExpr(instr.it, env, ctx);
        if (!Array.isArray(it)) throw new ErreurMynion("On ne peut parcourir qu'un régime (liste) ou bananera(…).", instr.ligne);
        for (const element of it) {
          budget(ctx, instr.ligne);
          env.vars.set(instr.nom, element);
          try { execBloc(instr.corps, env, ctx); }
          catch (e) {
            if (e && e.signal === "stupa") break;
            if (!(e && e.signal === "bananos")) throw e;
          }
        }
        return;
      }
      case "tantque": {
        while (verite(evalExpr(instr.cond, env, ctx))) {
          budget(ctx, instr.ligne);
          try { execBloc(instr.corps, env, ctx); }
          catch (e) {
            if (e && e.signal === "stupa") break;
            if (!(e && e.signal === "bananos")) throw e;
          }
        }
        return;
      }
      case "minion":
        env.vars.set(instr.nom, { fonction: true, params: instr.params, corps: instr.corps, env, nom: instr.nom });
        return;
      case "gelato":
        throw Object.assign(new Error("gelato"), { signal: "gelato", valeur: evalExpr(instr.valeur, env, ctx), ligne: instr.ligne });
      case "stupa":
        throw Object.assign(new Error("stupa"), { signal: "stupa", ligne: instr.ligne });
      case "bananos":
        throw Object.assign(new Error("bananos"), { signal: "bananos", ligne: instr.ligne });
      case "expr":
        evalExpr(instr.valeur, env, ctx);
        return;
    }
  }

  /* ── builtins ── */
  const BUILTINS = {
    bello(args, ctx) {
      ctx.sortie += args.map(versTexte).join(" ") + "\n";
      return null;
    },
    poka(args, ctx, ligne) {
      if (args.length > 1) throw new ErreurMynion("poka prend au maximum une question : poka(\"Ta question ? \")", ligne);
      if (args.length === 1) ctx.sortie += versTexte(args[0]);
      const rep = ctx.file.shift();
      if (rep === undefined) throw new ErreurMynion("Poka n'a rien reçu ! Écris la réponse dans le panneau « Entrée » (une réponse par ligne).", ligne);
      return rep;
    },
    bananera(args, ligne) {
      if (args.length < 1 || args.length > 3) throw new ErreurMynion("bananera attend 1, 2 ou 3 nombres : bananera(10) ou bananera(1, 10).", ligne);
      let a = 0, b = 0, pas2 = 1;
      if (args.length === 1) { b = nombreEntier(args[0], ligne, "bananera"); }
      else {
        a = nombreEntier(args[0], ligne, "bananera");
        b = nombreEntier(args[1], ligne, "bananera");
        if (args.length === 3) pas2 = nombreEntier(args[2], ligne, "bananera");
      }
      if (pas2 === 0) throw new ErreurMynion("Le pas de bananera est gong (0) — le régime tournerait en rond pour toujours !", ligne);
      const resultat = [];
      if (pas2 > 0) for (let v = a; v < b; v += pas2) { resultat.push(v); if (resultat.length > 50000) throw new ErreurMynion("Le régime est trop grand pour le Labo !", ligne); }
      else for (let v = a; v > b; v += pas2) { resultat.push(v); if (resultat.length > 50000) throw new ErreurMynion("Le régime est trop grand pour le Labo !", ligne); }
      return resultat;
    },
    muchos(args, ligne) {
      if (args.length !== 1) throw new ErreurMynion("muchos attend exactement 1 valeur.", ligne);
      const v = args[0];
      if (typeof v === "string" || Array.isArray(v)) return v.length;
      throw new ErreurMynion("muchos compte les lettres d'un texte ou les bananes d'une liste.", ligne);
    },
    hanadulsae(args, ligne) {
      if (args.length !== 1) throw new ErreurMynion("hanadulsae attend exactement 1 valeur.", ligne);
      const v = args[0];
      if (typeof v === "number") return Math.trunc(v);
      if (typeof v === "boolean") return v ? 1 : 0;
      if (typeof v === "string") {
        const s = v.trim();
        if (/^[+-]?\d+$/.test(s)) return parseInt(s, 10);
        throw new ErreurMynion("Hanadulsae n'arrive pas à compter « " + s + " » — il faut un nombre entier en texte, comme \"42\".", ligne);
      }
      throw new ErreurMynion("hanadulsae convertit un texte en nombre (ou arrondit un nombre).", ligne);
    },
    blabla(args) {
      if (args.length !== 1) throw new ErreurMynion("blabla attend exactement 1 valeur.");
      return versTexte(args[0]);
    },
    surprise(args, ligne) {
      if (args.length !== 2) throw new ErreurMynion("surprise attend 2 nombres : surprise(hana, yeoseot).", ligne);
      const a = nombreEntier(args[0], ligne, "surprise");
      const b = nombreEntier(args[1], ligne, "surprise");
      const lo = Math.min(a, b), hi = Math.max(a, b);
      return lo + Math.floor(Math.random() * (hi - lo + 1));
    },
    pousse(args, ligne) {
      if (args.length < 2) throw new ErreurMynion("pousse attend une liste puis des valeurs : pousse(minions, \"Otto\").", ligne);
      if (!Array.isArray(args[0])) throw new ErreurMynion("Le premier argument de pousse doit être un régime (liste).", ligne);
      for (let k = 1; k < args.length; k++) args[0].push(args[k]);
      return args[0];
    },
  };

  function evalExpr(e, env, ctx) {
    switch (e.t) {
      case "const":
        return e.val;
      case "var": {
        const env2 = chercherEnv(env, e.nom);
        if (env2) return env2.vars.get(e.nom);
        throw new ErreurMynion("Le minion « " + e.nom + " » n'existe pas. Crée-le avec me want, ou vérifie l'orthographe (les majuscules comptent !).", e.ligne);
      }
      case "liste":
        return e.items.map((it) => evalExpr(it, env, ctx));
      case "index": {
        const cible = evalExpr(e.e, env, ctx);
        const idx = evalExpr(e.idx, env, ctx);
        const i2 = nombreEntier(idx, e.ligne, "L'indice");
        if (Array.isArray(cible)) {
          if (i2 < 0 || i2 >= cible.length) throw new ErreurMynion("Tu cherches une banane absente du régime ! (indice " + i2 + " sur une liste de " + cible.length + ")", e.ligne);
          return cible[i2];
        }
        if (typeof cible === "string") {
          if (i2 < 0 || i2 >= cible.length) throw new ErreurMynion("Cette lettre n'existe pas dans le mot (indice " + i2 + ").", e.ligne);
          return cible[i2];
        }
        throw new ErreurMynion("Seuls les régimes (listes) et les textes se lisent avec [indice].", e.ligne);
      }
      case "neg": {
        const v = evalExpr(e.e, env, ctx);
        if (typeof v !== "number") throw new ErreurMynion("Le moins unaire s'applique à un nombre.", e.ligne);
        return -v;
      }
      case "non":
        return !verite(evalExpr(e.e, env, ctx));
      case "bin":
        return evalBin(e, env, ctx);
      case "methode":
        return evalMethode(e, env, ctx);
      case "appel":
        return evalAppel(e, env, ctx);
    }
    throw new ErreurMynion("Expression inconnue.", undefined);
  }

  function evalBin(e, env, ctx) {
    const op = e.op;
    if (op === "tiamo") {
      const g = evalExpr(e.g, env, ctx);
      if (!verite(g)) return false;
      return verite(evalExpr(e.d, env, ctx));
    }
    if (op === "oula") {
      const g = evalExpr(e.g, env, ctx);
      if (verite(g)) return true;
      return verite(evalExpr(e.d, env, ctx));
    }
    const g = evalExpr(e.g, env, ctx);
    const d = evalExpr(e.d, env, ctx);
    const melange = (typeof g === "string" && typeof d === "number") || (typeof g === "number" && typeof d === "string");
    switch (op) {
      case "+":
        if (melange) throw new ErreurMynion("Tu mélanges du texte et un nombre avec + — convertis avec blabla() ou hanadulsae().", e.ligne);
        if (Array.isArray(g) && Array.isArray(d)) return g.concat(d);
        return g + d;
      case "-":
        if (typeof g !== "number" || typeof d !== "number") throw new ErreurMynion("La soustraction se fait entre nombres.", e.ligne);
        return g - d;
      case "*":
        if (typeof g === "string" && typeof d === "number") {
          if (d < 0 || !Number.isInteger(d)) throw new ErreurMynion("On répète un texte avec un nombre entier positif.", e.ligne);
          return g.repeat(d);
        }
        if (typeof g === "number" && typeof d === "string") {
          if (g < 0 || !Number.isInteger(g)) throw new ErreurMynion("On répète un texte avec un nombre entier positif.", e.ligne);
          return d.repeat(g);
        }
        if (typeof g !== "number" || typeof d !== "number") throw new ErreurMynion("La multiplication se fait entre nombres (ou texte × nombre).", e.ligne);
        return g * d;
      case "/":
        if (d === 0) throw new ErreurMynion("Impossible de diviser par gong (0) ! Même un Minion ne peut pas partager zéro banane.", e.ligne);
        return g / d;
      case "//":
        if (d === 0) throw new ErreurMynion("Impossible de diviser par gong (0) ! Même un Minion ne peut pas partager zéro banane.", e.ligne);
        return Math.floor(g / d);
      case "%":
        if (d === 0) throw new ErreurMynion("Impossible de diviser par gong (0) ! Même un Minion ne peut pas partager zéro banane.", e.ligne);
        return ((g % d) + d) % d;
      case "**":
        if (typeof g !== "number" || typeof d !== "number") throw new ErreurMynion("La puissance se calcule entre nombres.", e.ligne);
        return Math.pow(g, d);
      case "==":
        return egal(g, d);
      case "!=":
        return !egal(g, d);
      case "<": case "<=": case ">": case ">=": {
        if (typeof g !== typeof d || (typeof g !== "number" && typeof g !== "string")) {
          throw new ErreurMynion("On compare deux nombres ou deux textes du même type.", e.ligne);
        }
        if (op === "<") return g < d;
        if (op === "<=") return g <= d;
        if (op === ">") return g > d;
        return g >= d;
      }
    }
    throw new ErreurMynion("Opérateur inconnu « " + op + " ».", e.ligne);
  }

  function evalMethode(e, env, ctx) {
    const cible = evalExpr(e.e, env, ctx);
    const args = e.args.map((a) => evalExpr(a, env, ctx));
    const m = e.nom.toLowerCase();
    if (typeof cible === "string") {
      if (m === "upper") return cible.toUpperCase();
      if (m === "lower") return cible.toLowerCase();
    }
    if (Array.isArray(cible) && m === "append") {
      cible.push(args[0]);
      return null;
    }
    throw new ErreurMynion("Ce minion ne connaît pas ce tour (." + e.nom + "). Essaie pousse(liste, x) !", e.ligne);
  }

  function evalAppel(e, env, ctx) {
    budget(ctx, e.ligne);
    const envF = chercherEnv(env, e.nom);
    const f = envF ? envF.vars.get(e.nom) : null;
    if (f && f.fonction) {
      if (e.args.length !== f.params.length) {
        throw new ErreurMynion("Le minion " + f.nom + " attend " + f.params.length + " valeur(s), tu lui en donnes " + e.args.length + ".", e.ligne);
      }
      const envAppel = creerEnv(f.env);
      for (let k = 0; k < f.params.length; k++) {
        envAppel.vars.set(f.params[k], evalExpr(e.args[k], env, ctx));
      }
      try {
        execBloc(f.corps, envAppel, ctx);
        return null;
      } catch (err) {
        if (err && err.signal === "gelato") return err.valeur;
        if (err && (err.signal === "stupa" || err.signal === "bananos")) {
          throw new ErreurMynion((err.signal === "stupa" ? "Stupa" : "Bananos") + " en dehors d'une boucle !", e.ligne);
        }
        throw err;
      }
    }
    const builtin = BUILTINS[e.nom.toLowerCase()];
    if (builtin) {
      const args = e.args.map((a) => evalExpr(a, env, ctx));
      return builtin(args, ctx, e.ligne);
    }
    throw new ErreurMynion("Le minion « " + e.nom + " » n'existe pas. Vérifie l'orthographe (bello, poka, surprise…).", e.ligne);
  }

  return { executer, lexique, analyser, versTexte };
})();

/* ═══════════════════ 4. TRANSPILEUR (Mynion → Python affiché) ═══════════════════ */
function transpiler(src) {
  let sortie = "";
  let i = 0;
  const n = src.length;
  while (i < n) {
    const c = src[i];
    if (c === '"' || c === "'") {
      const triple = src.substr(i, 3);
      let fin;
      if (triple === '"""' || triple === "'''") {
        fin = src.indexOf(triple, i + 3);
        fin = fin === -1 ? n : fin + 3;
      } else {
        let j = i + 1;
        while (j < n && src[j] !== c && src[j] !== "\n") j++;
        fin = (j < n && src[j] === c) ? j + 1 : j;
      }
      sortie += src.slice(i, fin);
      i = fin;
      continue;
    }
    if (c === "#") {
      const fin = src.indexOf("\n", i);
      const f2 = fin === -1 ? n : fin;
      sortie += src.slice(i, f2);
      i = f2;
      continue;
    }
    if (estLettreNom(c)) {
      let j = i;
      while (j < n && estCharNom(src[j])) j++;
      const bas = src.slice(i, j).toLowerCase();
      if (bas === "me") {
        let k = j;
        while (k < n && (src[k] === " " || src[k] === "\t")) k++;
        if (src.slice(k, k + 4).toLowerCase() === "want" && (k + 4 >= n || !estCharNom(src[k + 4]))) {
          sortie += "=";
          i = k + 4;
          continue;
        }
      }
      if (bas === "banana" || bas === "bananana") {
        const fin = src.indexOf("\n", i);
        const f2 = fin === -1 ? n : fin;
        sortie += "#" + src.slice(j, f2);
        i = f2;
        continue;
      }
      if (bas === "poopaye") {
        const fin = src.indexOf("\n", i);
        const f2 = fin === -1 ? n : fin;
        sortie += "# Poopaye !" + src.slice(j, f2);
        i = f2;
        continue;
      }
      sortie += MOTS_STRUCTURE[bas] || MOTS_NOMBRES_TEXTUEL[bas] || src.slice(i, j);
      i = j;
      continue;
    }
    sortie += c;
    i++;
  }
  return sortie;
}
const MOTS_NOMBRES_TEXTUEL = {
  gong: "0", hana: "1", dul: "2", sae: "3", net: "4", daseot: "5",
  yeoseot: "6", ilgop: "7", yeodeol: "8", ahop: "9", yeol: "10",
};

/* ═══════════════════ 5. COLORATION SYNTAXIQUE ═══════════════════ */
function echapperHTML(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function surligner(txt) {
  const K = Object.keys(MOTS_STRUCTURE).filter((m) => m !== "mewant");
  const B = MOTS_INBUILT;
  const NB = Object.keys(MOTS_NOMBRES);
  const CM = MOTS_COMMENTAIRE;
  let html = "";
  let i = 0;
  const n = txt.length;
  while (i < n) {
    const c = txt[i];
    if (c === "\n") { html += "\n"; i++; continue; }
    if (c === " " || c === "\t") { html += c; i++; continue; }
    if (c === "#") {
      let k = txt.indexOf("\n", i);
      if (k === -1) k = n;
      html += '<span class="c">' + echapperHTML(txt.slice(i, k)) + "</span>";
      i = k;
      continue;
    }
    if (c === '"' || c === "'") {
      let j = i + 1;
      while (j < n && txt[j] !== c && txt[j] !== "\n") j++;
      const fin = (j < n && txt[j] === c) ? j + 1 : j;
      html += '<span class="s">' + echapperHTML(txt.slice(i, fin)) + "</span>";
      i = fin;
      continue;
    }
    if (estLettreNom(c)) {
      let j = i;
      while (j < n && estCharNom(txt[j])) j++;
      const mot = txt.slice(i, j);
      const bas = mot.toLowerCase();
      if (CM.includes(bas)) {
        let k = txt.indexOf("\n", i);
        if (k === -1) k = n;
        html += '<span class="c">' + echapperHTML(txt.slice(i, k)) + "</span>";
        i = k;
        continue;
      }
      if ((bas === "f" || bas === "rf" || bas === "fr") && (txt[j] === '"' || txt[j] === "'")) {
        const q = txt[j];
        let k = j + 1;
        while (k < n && txt[k] !== q && txt[k] !== "\n") k++;
        const fin = (k < n && txt[k] === q) ? k + 1 : k;
        html += '<span class="s">' + echapperHTML(txt.slice(i, fin)) + "</span>";
        i = fin;
        continue;
      }
      if (bas === "me") {
        let k2 = j;
        while (k2 < n && (txt[k2] === " " || txt[k2] === "\t")) k2++;
        if (txt.slice(k2, k2 + 4).toLowerCase() === "want") {
          html += '<span class="k">' + echapperHTML(txt.slice(i, k2 + 4)) + "</span>";
          i = k2 + 4;
          continue;
        }
      }
      if (K.includes(bas)) html += '<span class="k">' + echapperHTML(mot) + "</span>";
      else if (B.includes(bas)) html += '<span class="b">' + echapperHTML(mot) + "</span>";
      else if (NB.includes(bas)) html += '<span class="n">' + echapperHTML(mot) + "</span>";
      else html += echapperHTML(mot);
      i = j;
      continue;
    }
    if (c >= "0" && c <= "9") {
      let j = i;
      while (j < n && ((txt[j] >= "0" && txt[j] <= "9") || txt[j] === ".")) j++;
      html += '<span class="n">' + echapperHTML(txt.slice(i, j)) + "</span>";
      i = j;
      continue;
    }
    if ("+-*/%<>=()[]{},:.".includes(c)) {
      html += '<span class="o">' + echapperHTML(c) + "</span>";
      i++;
      continue;
    }
    html += echapperHTML(c);
    i++;
  }
  return html;
}

/* export Node pour les tests */
if (typeof module !== "undefined" && module.exports) {

}

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   🍌 APP MYNION — interface façon application mobile (Mimo-like).
   Parcours de leçons, XP, série, Labo, dictionnaire. FR / EN.
   ═══════════════════════════════════════════════════════════════════════════ */
"use strict";

(function () {

  const CLE = "mynion_site_v1";
  const XP_ETAPE = { quiz: 10, tapfill: 10, ordre: 10, ecriture: 15, theorie: 0 };
  const XP_BONUS_LECON = 10;

  /* ── état persistant ── */
  function etatInitial() {
    return {
      lang: null, vue: "parcours", xp: 0, progres: {}, serie: { last: null, count: 0 },
      muet: false, toutDeverrouille: false, lecon: null, labo: null, nom: "",
    };
  }
  let ETAT = etatInitial();
  function charger() {
    try {
      const brut = localStorage.getItem(CLE);
      if (brut) ETAT = Object.assign(etatInitial(), JSON.parse(brut));
    } catch (e) { /* navigateur privé */ }
  }
  function sauver() {
    try { localStorage.setItem(CLE, JSON.stringify(ETAT)); } catch (e) {}
  }

  /* ── le Labo n'est ouvert qu'après avoir terminé le parcours
     (le bouton « tout déverrouiller » sert de passe-droits pour tester) ── */
  function laboOuvert() {
    return nbFaites() === CURRICULUM.length || ETAT.toutDeverrouille;
  }

  /* ── i18n ── */
  function t(cle) {
    const dico = I18N[ETAT.lang] || I18N.fr;
    return dico.ui[cle] !== undefined ? dico.ui[cle] : (I18N.fr.ui[cle] !== undefined ? I18N.fr.ui[cle] : cle);
  }
  function L(x) { return typeof x === "string" ? x : ((x && (x[ETAT.lang] !== undefined ? x[ETAT.lang] : x.fr)) || ""); }
  function niveauActuel() {
    const niv = (I18N[ETAT.lang] || I18N.fr).niveaux;
    let nom = niv[0].nom;
    for (const n of niv) { if (ETAT.xp >= n.seuil) nom = n.nom; }
    return nom;
  }
  const alea = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const bravo = () => alea((I18N[ETAT.lang] || I18N.fr).bravos);
  const oups = () => alea((I18N[ETAT.lang] || I18N.fr).oups);

  /* ── sons (WebAudio, discrets) ── */
  let audioCtx = null;
  function son(seq) {
    if (ETAT.muet) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      let t0 = audioCtx.currentTime;
      for (const n of seq) {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = n.t || "sine";
        o.frequency.value = n.f;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.14, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + n.d);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t0); o.stop(t0 + n.d + 0.05);
        t0 += n.d;
      }
    } catch (e) {}
  }
  const sons = {
    bon: () => son([{ f: 660, d: 0.12 }, { f: 880, d: 0.18 }]),
    mauvais: () => son([{ f: 190, d: 0.22, t: "sawtooth" }]),
    fini: () => son([{ f: 523, d: 0.12 }, { f: 659, d: 0.12 }, { f: 784, d: 0.12 }, { f: 1046, d: 0.3 }]),
  };

  /* ── confettis & toast ── */
  function confettis() {
    const emojis = ["🍌", "🎉", "⭐", "🎈", "🍌", "🏆"];
    for (let k = 0; k < 26; k++) {
      const s = document.createElement("span");
      s.className = "confetti";
      s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      s.style.left = (4 + Math.random() * 92) + "vw";
      s.style.animationDelay = (Math.random() * 0.6) + "s";
      s.style.fontSize = (16 + Math.random() * 16) + "px";
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 3200);
    }
  }
  let toastT = null;
  function toast(msg) {
    let el = document.querySelector(".toast");
    if (!el) { el = document.createElement("div"); el.className = "toast"; document.body.appendChild(el); }
    el.textContent = msg;
    el.style.display = "block";
    clearTimeout(toastT);
    toastT = setTimeout(() => { el.style.display = "none"; }, 2400);
  }

  /* ── helpers de leçons ── */
  function leconParId(id) { return CURRICULUM.find((l) => l.id === id); }
  function leconDebloquee(i) {
    return ETAT.toutDeverrouille || i === 0 || !!ETAT.progres[CURRICULUM[i - 1].id];
  }
  function nbFaites() { return CURRICULUM.filter((l) => ETAT.progres[l.id]).length; }
  function prochaineLecon() {
    for (let i = 0; i < CURRICULUM.length; i++) {
      if (!ETAT.progres[CURRICULUM[i].id] && leconDebloquee(i)) return { l: CURRICULUM[i], i };
    }
    return null;
  }
  function majSerie() {
    const auj = new Date().toISOString().slice(0, 10);
    const s = ETAT.serie;
    if (s.last === auj) return;
    const hier = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
    s.count = (s.last === hier) ? s.count + 1 : 1;
    s.last = auj;
  }
  function normaliser(s) {
    return String(s).replace(/\r/g, "").split("\n").map((l) => l.replace(/[ \t]+$/, "")).join("\n").replace(/\n+$/, "");
  }
  function codeDe(x) { return typeof x === "string" ? x : L(x); }

  /* ── composant éditeur ── */
  function creerEditeur(hote, codeInitial, hauteur, callbacks) {
    callbacks = callbacks || {};
    const wrap = document.createElement("div");
    wrap.className = "editeur-wrap";
    wrap.style.height = (hauteur || 170) + "px";
    const nums = document.createElement("div"); nums.className = "numeros";
    const zone = document.createElement("div"); zone.className = "zone-editeur";
    const pre = document.createElement("pre"); pre.setAttribute("aria-hidden", "true");
    const ta = document.createElement("textarea");
    ta.setAttribute("spellcheck", "false");
    ta.setAttribute("autocapitalize", "off");
    ta.setAttribute("autocorrect", "off");
    ta.setAttribute("autocapitalize", "none");
    ta.value = codeInitial || "";
    zone.appendChild(pre); zone.appendChild(ta);
    wrap.appendChild(nums); wrap.appendChild(zone);
    hote.appendChild(wrap);

    function maj() {
      pre.innerHTML = surligner(ta.value) + "\n";
      const nb = ta.value.split("\n").length;
      let g = "";
      for (let k = 1; k <= nb; k++) g += k + "\n";
      nums.textContent = g;
      pre.scrollTop = ta.scrollTop; pre.scrollLeft = ta.scrollLeft;
      nums.scrollTop = ta.scrollTop;
    }
    function inserer(txt) {
      const s = ta.selectionStart, f = ta.selectionEnd;
      ta.setRangeText(txt, s, f, "end");
      maj();
      if (callbacks.onchange) callbacks.onchange(ta.value);
    }
    ta.addEventListener("input", () => { maj(); if (callbacks.onchange) callbacks.onchange(ta.value); });
    ta.addEventListener("scroll", () => {
      pre.scrollTop = ta.scrollTop; pre.scrollLeft = ta.scrollLeft; nums.scrollTop = ta.scrollTop;
    });
    ta.addEventListener("keydown", (e) => {
      if (e.key === "Tab") { e.preventDefault(); inserer("    "); }
      else if (e.key === "Enter") {
        e.preventDefault();
        const avant = ta.value.slice(0, ta.selectionStart);
        const ligne = avant.slice(avant.lastIndexOf("\n") + 1);
        let indent = (ligne.match(/^[ \t]*/) || [""])[0];
        if (ligne.trimEnd().endsWith(":")) indent += "    ";
        inserer("\n" + indent);
      }
      else if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        e.preventDefault();
        if (callbacks.onrun) callbacks.onrun();
      }
    });
    maj();
    return {
      get code() { return ta.value; },
      set code(v) { ta.value = v; maj(); },
      focus: () => ta.focus(),
    };
  }

  /* ═══════════════ RENDU ═══════════════ */
  function rendu() {
    const posY = window.scrollY;
    document.documentElement.lang = ETAT.lang;

    /* le Labo reste fermé tant que le parcours n'est pas terminé */
    if (ETAT.vue === "labo" && !laboOuvert()) ETAT.vue = "parcours";

    /* barre du haut */
    document.getElementById("jeton-xp").innerHTML = "⭐ <b>" + ETAT.xp + "</b>";
    document.getElementById("jeton-xp").title = t("xpLabel");
    document.getElementById("jeton-serie").innerHTML = "🔥 <b>" + (ETAT.serie.count || 0) + "</b>";
    document.getElementById("jeton-serie").title = t("serieLabel");
    document.querySelectorAll(".lang").forEach((b) => {
      b.classList.toggle("actif", b.getAttribute("data-action") === "lang:" + ETAT.lang);
    });
    document.getElementById("btn-son").textContent = ETAT.muet ? "🔇" : "🔊";

    /* menu du bas */
    document.querySelectorAll("#onglets button").forEach((b) => {
      const nav = b.getAttribute("data-nav");
      const ferme = nav === "labo" && !laboOuvert();
      b.classList.toggle("actif", nav === ETAT.vue);
      b.classList.toggle("verrouille", ferme);
      b.querySelector(".lbl").textContent = ferme ? "🔒 " + t("labo") : t(nav);
    });

    const app = document.getElementById("app");
    if (ETAT.vue === "labo") { app.innerHTML = htmlLabo(); brancherLabo(); }
    else if (ETAT.vue === "dico") { app.innerHTML = htmlDico(); brancherDico(); }
    else if (ETAT.lecon) { app.innerHTML = htmlLecon(); brancherEtape(); }
    else { app.innerHTML = htmlAccueil(); brancherAccueil(); }

    sauver();
    window.scrollTo(0, posY);
  }

  /* ── ACCUEIL ── */
  function htmlAccueil() {
    const faites = nbFaites(), total = CURRICULUM.length;
    const pct = Math.round((faites / total) * 100);

    let html = `<div class="hero">

      <div class="progression"><div class="barre-prog"><div style="width:${pct}%"></div></div><span class="pct">${pct}%</span></div>

    </div>`;

    if (prochaine) {
      html += `<button class="btn btn-primaire" data-action="lecon:${prochaine.l.id}" style="margin-bottom:18px">

      html += `<div class="carte diplome">
        <div class="gros">🏆👓</div>

        <p class="texte-etape">${t("certificatTexte")}</p>
        <p class="mini-note">${t("tonNom")}</p>
        <input class="champ-nom" id="nom-diplome" placeholder="Kevin, Stuart, Bob…" value="${echapperHTML(ETAT.nom)}" maxlength="40">
        <div class="diplome-etiquette" id="etiquette-nom">${echapperHTML(ETAT.nom || "…")}</div>
        <p class="mini-note">${numDiplome} · ${total}/${total} ${t("lecons")} · ⭐ ${ETAT.xp} XP · ${date}</p>
        ${htmlPartage()}

    html += `<div class="chemin">`;

      const fait = !!ETAT.progres[l.id];
      const debloquee = leconDebloquee(i);

      const statut = fait ? "✅" : (debloquee ? (estProchaine ? "▶️" : "•") : "🔒");
      html += `<div class="ch-item">
        <div class="ch-rail">

          ${i < CURRICULUM.length - 1 ? `<div class="ch-tige ${fait ? "fait" : ""}"></div>` : ""}

          <div><h3>${l.emoji} ${L(l.titre)}</h3><div class="sous">${L(l.sous)}</div></div>
          <div class="statut">${statut}</div>
        </div>
      </div>`;
    });
    html += `</div>`;

    html += `<div class="pied">
      <button class="btn btn-fantome btn-mini" data-action="deverrouiller">${t("deverrouiller")}</button>

      <div style="margin-top:14px">${t("pied")}</div>

  /* ── PARTAGE DU DIPLÔME ──
     L'URL partagée est celle par laquelle l'utilisateur visite le site
     (location.origin + pathname) : elle reste correcte sur n'importe quel
     dépôt GitHub Pages, fork ou domaine personnalisé. */
  function urlDuSite() {
    try {
      if (location.protocol === "file:") return null;
      return location.origin + location.pathname;
    } catch (e) { return null; }
  }
  function htmlPartage() {
    if (!urlDuSite()) return `<p class="mini-note">⚠️ ${t("partageLocal")}</p>`;
    return `<div class="etiquette-partage">📣 ${t("partagerSur")}</div>
      <div class="partage">
        <button class="btn-partage pli" data-action="partager:linkedin"><b>in</b> LinkedIn</button>
        <button class="btn-partage pfb" data-action="partager:facebook"><b>f</b> Facebook</button>
        <button class="btn-partage pxx" data-action="partager:x">𝕏</button>
        <button class="btn-partage pcp" data-action="partager:copier">${t("copierLien")}</button>
      </div>`;
  }
  function textePartage() {
    return ETAT.lang === "fr"
      ? "J'ai décroché le Diplôme de la Banane d'Or en apprenant à coder avec MYNION, le langage des Minions ! 🍌👓"
      : "I earned the Golden Banana Diploma by learning to code with MYNION, the Minion language! 🍌👓";
  }
  function actionPartager(reseau) {
    const url = urlDuSite();
    if (!url) { toast("⚠️ " + t("partageLocal")); return; }
    const enc = encodeURIComponent(url);
    const encT = encodeURIComponent(textePartage());
    let cible = null;
    if (reseau === "linkedin") cible = "https://www.linkedin.com/sharing/share-offsite/?url=" + enc;
    else if (reseau === "facebook") cible = "https://www.facebook.com/sharer/sharer.php?u=" + enc;
    else if (reseau === "x") cible = "https://twitter.com/intent/tweet?url=" + enc + "&text=" + encT;
    else if (reseau === "whatsapp") cible = "https://wa.me/?text=" + encT + "%20" + enc;
    else if (reseau === "copier") { copierTexte(url); return; }
    if (cible) {
      const f = window.open(cible, "_blank", "noopener");
      if (!f) toast("⃠ " + (ETAT.lang === "fr" ? "Popup bloquée — autorise les popups !" : "Popup blocked — allow popups!"));
    }
  }
  function copierTexte(txt) {
    const confirme = () => toast("📋 " + t("lienCopie"));
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(confirme, () => copierSecours(txt, confirme));
    } else copierSecours(txt, confirme);
  }
  function copierSecours(txt, fait) {
    try {
      const ta = document.createElement("textarea");
      ta.value = txt;
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
      fait();
    } catch (e) { toast(txt); }
  }
  function brancherAccueil() {
    const champ = document.getElementById("nom-diplome");
    if (champ) {
      champ.addEventListener("input", () => {
        ETAT.nom = champ.value;
        const etiquette = document.getElementById("etiquette-nom");
        if (etiquette) etiquette.textContent = ETAT.nom || "…";
        sauver();
      });
    }
  }

  /* ── LEÇON ── */
  function htmlLecon() {
    const l = leconParId(ETAT.lecon.id);
    if (!l) { ETAT.lecon = null; return htmlAccueil(); }
    const LS = ETAT.lecon;
    const n = l.etapes.length;

    /* écran de fin */
    if (LS.terminee) {
      const xpG = LS.xpTotal || 0;
      const toutFini = nbFaites() === CURRICULUM.length;
      return `<div class="ecran-fete">
        <div class="gros">${toutFini ? "🏆👓" : l.emoji}</div>
        <h2>${toutFini ? t("certificatTitre") : t("leconTerminee")}</h2>
        <div class="xp-gagnee">${t("xpGagne").replace("{xp}", xpG)}</div>
        <p class="mini-note">🔥 ${ETAT.serie.count || 0} · ⭐ ${ETAT.xp} XP · ${niveauActuel()}</p>
        ${toutFini ? `<p class="mini-note" style="margin:4px 0 0">🧪 ${t("laboDebloque")}</p>` : ""}
        ${toutFini ? `<div style="max-width:420px;margin:0 auto 6px">${htmlPartage()}</div>` : ""}
        <button class="btn btn-vert" data-action="lecon:quitter" style="max-width:320px;margin:10px auto 0">${t("retourParcours")}</button>

    }

    const pct = Math.round((LS.etape / n) * 100);
    let html = `<div class="barre-lecon">
        <button class="quitter" data-action="lecon:quitter">✕</button>
        <div class="barre-prog"><div style="width:${pct}%"></div></div>
        <span class="compteur-etapes">${LS.etape + 1}/${n}</span>
      </div>
      <h2 class="titre-lecon">${l.emoji} ${L(l.titre)}</h2>`;

    const res = LS.resultats[LS.etape];
    html += corpsEtape(etape, LS);

    if (res && res.ok) {
      html += `<div class="retro bonne"><div class="titre-retro">${bravo()} ${t("xpGagne").replace("{xp}", XP_ETAPE[etape.type] || 0)}</div>${res.explication ? L(res.explication) : ""}</div>
        <div class="ligne-boutons" style="margin-top:12px">
          <button class="btn btn-vert" data-action="etape:continuer">${t("continuer")} →</button>
        </div>`;
    } else if (res && !res.ok) {
      html += `<div class="retro mauvaise"><div class="titre-retro">${oups()} ${t("reessayer")}</div>${res.explication ? L(res.explication) : ""}</div>`;
      if (res.sortieUtilisateur !== undefined) {
        html += `<div class="etiquette-sortie">${t("taSortie")}</div><div class="bloc-sortie">${echapperHTML(res.sortieUtilisateur || "—")}</div>`;
      }
    }
    return html;
  }

  function blocCodeAvecEntree(etape) {
    let html = "";
    if (etape.entree !== undefined) {
      html += `<div class="champ-info">⌨ ${t("entree")} : <b>${echapperHTML(codeDe(etape.entree) || "—")}</b></div>`;
    }
    return html;
  }

  function corpsEtape(etape, LS) {
    const idx = LS.etape;
    if (etape.type === "theorie") {
      let html = `<div class="carte"><p class="texte-etape">${L(etape.texte)}</p>`;
      if (etape.code) html += blocCodeAvecEntree(etape) + `<div class="bloc">${surligner(codeDe(etape.code))}</div>`;
      if (etape.sortie !== undefined) {
        html += `<div class="etiquette-sortie">${t("resultatAttendu")}</div><div class="bloc-sortie">${echapperHTML(L(etape.sortie))}</div>`;
      }
      html += `</div>
      <div class="ligne-boutons"><button class="btn btn-primaire" data-action="etape:continuer">${t("continuer")} →</button></div>`;
      return html;
    }

    if (etape.type === "quiz") {
      const res = LS.resultats[idx];
      const opts = L(etape.options) || etape.options.fr;
      let html = `<div class="carte">
        <p class="texte-etape"><b>${t("ecoute")}</b></p>`;
      if (etape.question) html += `<p class="texte-etape">${L(etape.question)}</p>`;
      if (etape.code) html += blocCodeAvecEntree(etape) + `<div class="bloc">${surligner(codeDe(etape.code))}</div>`;
      html += `<div class="options">`;
      opts.forEach((o, i) => {
        let cls = "option";
        if (res) {
          if (res.ok) { if (i === etape.bonne) cls += " bonne"; }
          else if (i === res.choix) cls += " mauvaise";
        }
        /* réessaillable tant que ce n'est pas juste */
        html += `<button class="${cls}" data-action="reponse:${i}" ${res && res.ok ? "disabled" : ""}>${echapperHTML(o)}</button>`;
      });
      html += `</div></div>`;
      return html;
    }

    if (etape.type === "tapfill") {
      const res = LS.resultats[idx];
      const opts = L(etape.options) || etape.options.fr;
      const rempli = res ? (LS.remplis[idx] !== undefined ? opts[LS.remplis[idx]] : undefined) : (LS.remplis[idx] !== undefined ? opts[LS.remplis[idx]] : undefined);
      const code = codeDe(etape.code);
      const i = code.indexOf("___");
      let codeHTML;
      if (i === -1) codeHTML = surligner(code);
      else codeHTML = surligner(code.slice(0, i)) + `<span class="trou">${rempli !== undefined ? echapperHTML(rempli) : "…"}</span>` + surligner(code.slice(i + 3));
      let html = `<div class="carte">
        <div class="bloc code-a-trou">${codeHTML}</div>
        <div class="tuiles">`;
      opts.forEach((o, i2) => {
        let cls = "tuile";
        if (res) {
          if (res.ok) { if (i2 === etape.bonne) cls += " bonne"; }
          else if (i2 === LS.remplis[idx]) cls += " mauvaise";
        }
        /* réessaillable tant que ce n'est pas juste */
        html += `<button class="${cls}" data-action="reponse:${i2}" ${res && res.ok ? "disabled" : ""}>${echapperHTML(o)}</button>`;
      });
      html += `</div></div>`;
      return html;
    }

    if (etape.type === "ordre") {
      /* la pioche est mélangée au premier affichage de l'étape */
      if (!LS.ordres[idx]) {
        LS.ordres[idx] = {
          pile: etape.lignes.map((_, k) => k).sort(() => Math.random() - 0.5),
          pris: [],
        };
      }
      const ordre = LS.ordres[idx];
      let html = `<div class="carte">
        <p class="texte-etape">${L(etape.consigne)}</p>
        <div class="pioche">`;
      ordre.pile.forEach((iLigne) => {
        html += `<button class="ligne-ordre" data-action="ordre:prendre:${iLigne}">${surligner(etape.lignes[iLigne])}</button>`;
      });
      html += `</div>
        <div class="etiquette-sortie">⬇︎</div>
        <div class="empilement" data-vide="${t("ordreVide")}">`;
      ordre.pris.forEach((iLigne, k) => {
        html += `<button class="ligne-ordre choisie" data-action="ordre:retirer:${k}"><span class="num-ligne">${k + 1}</span>${surligner(etape.lignes[iLigne])}</button>`;
      });
      html += `</div>
        <div class="ligne-boutons" style="margin-top:12px">
          <button class="btn btn-primaire" data-action="ordre:verifier">${t("verifier")}</button>
        </div>
      </div>`;
      return html;
    }

    if (etape.type === "ecriture") {
      let html = `<div class="carte">
        <p class="texte-etape"><b>⌨️ ${t("aToiDeCoder")}</b></p>
        <p class="texte-etape">${L(etape.consigne)}</p>
        ${blocCodeAvecEntree(etape)}
        <div id="editeur-etape"></div>
        <div class="etiquette-sortie">${t("resultatAttendu")}</div>
        <div class="bloc-sortie">${echapperHTML(L(etape.attendu))}</div>
        <div class="ligne-boutons">
          <button class="btn btn-vert" data-action="etape:verifier">✓ ${t("verifier")}</button>
          <button class="btn btn-fantome" data-action="etape:executer">${t("executer")}</button>
        </div>
        <div class="ligne-boutons">
          <button class="btn btn-fantome btn-mini" data-action="etape:indice">${t("indice")}</button>
          <button class="btn btn-fantome btn-mini" data-action="etape:solution">${t("solution")}</button>
        </div>
        ${LS.indices[idx] ? `<div class="champ-info">💡 ${echapperHTML(L(etape.indice))}</div>` : ""}
        <div class="etiquette-sortie">${t("taSortie")}</div>
        <div class="console ${LS.consoles[idx] ? "" : "vide"}" id="console-etape">${LS.consoles[idx] ? echapperHTML(LS.consoles[idx]) : t("consoleVide")}</div>
      </div>`;
      return html;
    }
    return "";
  }

  function brancherEtape() {
    const LS = ETAT.lecon;
    const l = leconParId(LS.id);
    if (!l || LS.terminee) return;
    const etape = l.etapes[LS.etape];
    if (etape.type === "ecriture") {
      const hote = document.getElementById("editeur-etape");
      if (hote) {
        LS.brouillons[LS.etape] = LS.brouillons[LS.etape] !== undefined ? LS.brouillons[LS.etape] : codeDe(etape.codeDepart || "");
        creerEditeur(hote, LS.brouillons[LS.etape], 180, {
          onchange: (v) => { LS.brouillons[LS.etape] = v; sauver(); },
          onrun: () => actionExecuterEtape(false),
        });
      }
    }
  }

    const el = document.getElementById("python-labo");

    ETAT.labo.python = transpiler(ETAT.labo.code || "");

    if (res.erreur) {
      affiche = "🍌💥 " + res.erreur.message + (res.erreur.ligne ? "\n" + t("etape") + " " + res.erreur.ligne : "");
